<!DOCTYPE html>
<html lang="es" class="emn-landing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include emn-favicon.html %}
<title>EMN — Mi Aula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/emn.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/emn-auth.js?v={{ site.time | date: '%s' }}"></script>
<style>
  body{ margin:0; background:#fff; }
  #mi-aula-app button{ font-family:Inter,system-ui,sans-serif; cursor:pointer; }
  #mi-aula-app button:hover{ filter:brightness(0.95); }
  #aula-gate{ text-align:center; padding:80px 20px; color:#5b6070; font-family:Inter,system-ui,sans-serif; }
  #aula-gate a{ color:#C8102E; font-weight:600; }
</style>
</head>
<body>

{% include emn-header.html %}

<div id="aula-gate" hidden></div>
<div id="mi-aula-app" hidden></div>

{% raw %}
<script type="text/x-template" id="tpl">
<div style="min-height: 100%; background: #ffffff; color: #1a1a1d; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.4">


<div style="max-width: 1760px; margin: 0 auto; padding: 24px 32px 64px; display: flex; flex-direction: column; gap: 24px">

<!-- HEADER -->
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px">
<div style="display: flex; align-items: center; gap: 16px">
<div>
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1.1; color: #17171a">Hola, {{nombre}}</h1>
<p style="margin: 4px 0 0; color: #5b6070; font-size: 14px">{{sub}}</p>
</div>
<div style="position: relative; width: 60px; height: 60px; flex: none" role="img" aria-label="Progreso hacia tu audición: {{rutaPct}} por ciento">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true" style="display: block">
<circle cx="30" cy="30" r="25" style="fill: none; stroke: #eceef2; stroke-width: 6px"/>
<circle cx="30" cy="30" r="25" style="fill: none; stroke: #C8102E; stroke-width: 6px; stroke-linecap: round; stroke-dasharray: {{ringDash}} 157.1; transform: rotate(-90deg); transform-origin: 30px 30px"/>
</svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 17px; color: #17171a">{{rutaPct}}%</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
{{picker}}
<button type="button" style="background: #ffffff; color: #C8102E; border: 1.5px solid #C8102E; border-radius: 999px; padding: 10px 22px; min-height: 48px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Mi Drive</button>
<button type="button" data-href="{{singsyncHref}}" data-live="singsync" style="background: #C8102E; color: #ffffff; border: 0; border-radius: 999px; padding: 10px 24px; min-height: 48px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l3-8 4 16 3-8h5"/></svg>Entrar a SingSync</button>
</div>
</div>

<!-- STATS -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px">
<div style="border: 1px solid #e3e5ea; border-radius: 14px; padding: 12px 18px">
<div style="font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6070; font-weight: 600">Próxima clase</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600; margin-top: 2px">{{proxClase}}</div>
</div>
<div style="border: 1px solid #e3e5ea; border-radius: 14px; padding: 12px 18px">
<div style="font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6070; font-weight: 600">Tareas pendientes</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600; margin-top: 2px">{{tareasTxt}}</div>
</div>
<div style="border: 1px solid #e3e5ea; border-radius: 14px; padding: 12px 18px">
<div style="font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6070; font-weight: 600">Mock Audition</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600; margin-top: 2px">{{mockTxt}}</div>
</div>
<div style="border: 1px solid #e3e5ea; border-radius: 14px; padding: 12px 18px">
<div style="font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6070; font-weight: 600">Racha de práctica</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 600; margin-top: 2px">{{rachaTxt}}</div>
<div style="font-size: 12px; color: #5b6070; margin-top: 2px">{{rachaSub}}</div>
</div>
</div>
{{offBanner}}

<!-- ROW 1: CALENDAR + TASKS / MOCK -->
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">

<section style="flex: 2.4 1 640px; min-width: 0; border: 1px solid #e3e5ea; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" data-act="prev" aria-label="Mes anterior" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #d5d8df; background: #fff; color: #C8102E; font-size: 17px">‹</button>
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px">{{monthTitle}}</h2>
<button type="button" data-act="next" aria-label="Mes siguiente" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #d5d8df; background: #fff; color: #C8102E; font-size: 17px">›</button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px">
<span style="font-size: 12px; font-weight: 600; color: #5b6070; margin-right: 2px">Mis clases:</span>
<sc-for list="{{legend}}" as="lg" hint-placeholder-count="3">
<span style="{{lg.style}}">{{lg.label}}</span>
</sc-for>
</div>
<button type="button" data-act="today" style="background: #fff; border: 1px solid #d5d8df; border-radius: 10px; padding: 8px 16px; min-height: 40px; font-size: 14px; font-weight: 500; color: #1a1a1d">Hoy</button>
</div>
<div style="overflow-x: auto">
<div style="min-width: 560px">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 6px; text-align: center; font-size: 11.5px; letter-spacing: 0.06em; color: #5b6070; font-weight: 600">
<span>DOM</span><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cells}}" as="day" hint-placeholder-count="35">
<div style="{{day.cellStyle}}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; min-height: 28px">
<span style="{{day.numStyle}}">{{day.n}}</span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<sc-if value="{{day.hasLink}}" hint-placeholder-val="{{ true }}">
<a href="{{day.link}}" target="_blank" rel="noopener" aria-label="{{day.btnLabel}}" style="{{day.btnStyle}}text-decoration:none;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l7-4v12l-7-4z"/></svg>
</a>
</sc-if>
<sc-if value="{{day.noLink}}" hint-placeholder-val="{{ true }}">
<button type="button" disabled title="Aún no hay link de la clase" aria-label="{{day.btnLabel}}" style="{{day.btnStyle}}opacity:0.35;cursor:default;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l7-4v12l-7-4z"/></svg>
</button>
</sc-if>
{{day.singsyncs}}
</div>
</div>
{{day.chips}}
</div>
</sc-for>
</div>
</div>
</div>
</section>

<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="flex: 1; border: 1px solid #e3e5ea; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; color: #C8102E">Tareas pendientes</h2>
<span style="background: #FDE8EB; color: #8F0B20; font-weight: 700; font-size: 13px; border-radius: 999px; padding: 3px 11px">{{tasksCount}}</span>
</div>
<div style="color: #5b6070; font-size: 14px; padding: 6px 0">{{tasksEmpty}}</div>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eceef2; padding-bottom: 10px; {{t.rowStyle}}">
<span data-act="tarea" data-id="{{t.id}}" role="checkbox" aria-label="Marcar como hecha" style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid #b8bcc7; flex: none; cursor: {{t.cursor}}; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; {{t.boxStyle}}">{{t.mark}}</span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600; font-size: 14.5px">{{t.title}}</div><div style="font-size: 12.5px; color: #5b6070">{{t.meta}}</div></div>
</div>
</sc-for>
</section>

</div>
</div>

<!-- ROWS 2-3 -->
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch">

<section style="flex: 1 1 600px; min-width: 0; border: 1px solid #e3e5ea; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div>
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; color: #C8102E">Comienza a practicar</h2>
</div>
<div style="border: 1px solid #eceef2; background: #FAFAFB; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><span style="font-weight: 700; font-size: 15px">Meta semanal</span><strong style="font-size: 18px">{{metaTxt}}</strong></div>
<div style="height: 12px; border-radius: 999px; background: #eceef2; overflow: hidden"><div style="width: {{metaPct}}%; height: 100%; background: #C8102E; border-radius: 999px"></div></div>
<div style="font-size: 14px; font-weight: 600">Horas trabajadas <strong style="color: #C8102E; font-size: 16px">{{horasTxt}}</strong></div>
</div>
<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: center; gap: 16px">
<button type="button" data-href="/improvisation-lab" style="aspect-ratio: 8 / 5; border: 0; border-radius: 14px; background: #FBDDE1; color: #6E0A1A; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Piece Prep &amp; Improvisation</button>
<button type="button" data-href="/sight-melody" style="aspect-ratio: 8 / 5; border: 0; border-radius: 14px; background: #D5E1F6; color: #14305F; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Sight-read &amp; Ear Training</button>
<button type="button" data-href="/interview-prep" style="aspect-ratio: 8 / 5; border: 0; border-radius: 14px; background: #D3EEDD; color: #0F4A2A; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 1.25; text-align: center">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>Interview Prep</button>
</div>
</section>

<section style="flex: 1 1 600px; min-width: 0; border: 1px solid #e3e5ea; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px">
<div>
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; color: #C8102E">Tu progreso por área</h2>
<p style="margin: 2px 0 0; color: #5b6070; font-size: 13px">Puntaje (sobre 100) de cada Mock Audition por parte, mes a mes.</p>
</div>
<select data-act="area" aria-label="Filtrar por parte de la audición" style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1d; background: #ffffff; border: 1.5px solid #C8102E; border-radius: 999px; padding: 9px 14px; min-height: 44px">
{{areaOptions}}
</select>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; font-weight: 600; color: #3a3d45">{{chartLegend}}</div>
<div style="color: #5b6070; font-size: 14px">{{chartEmpty}}</div>
<div style="display: flex; gap: 8px">
<div style="width: 36px; flex: none; position: relative; height: 220px; font-size: 11px; color: #5b6070; text-align: right">
<span style="position: absolute; right: 0; top: 4%; transform: translateY(-50%)">100</span>
<span style="position: absolute; right: 0; top: 50%; transform: translateY(-50%)">50</span>
<span style="position: absolute; right: 0; top: 96%; transform: translateY(-50%)">0</span>
</div>
<div style="flex: 1; min-width: 0">
<div style="position: relative; height: 220px">
<svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%" style="position: absolute; inset: 0; overflow: visible" aria-hidden="true">
<line x1="0" x2="100" y1="4" y2="4" style="stroke: #e3e5ea; stroke-width: 1px; vector-effect: non-scaling-stroke"/>
<line x1="0" x2="100" y1="27" y2="27" style="stroke: #f0f1f4; stroke-width: 1px; vector-effect: non-scaling-stroke"/>
<line x1="0" x2="100" y1="50" y2="50" style="stroke: #e3e5ea; stroke-width: 1px; vector-effect: non-scaling-stroke"/>
<line x1="0" x2="100" y1="73" y2="73" style="stroke: #f0f1f4; stroke-width: 1px; vector-effect: non-scaling-stroke"/>
<line x1="0" x2="100" y1="96" y2="96" style="stroke: #c9ccd4; stroke-width: 1px; vector-effect: non-scaling-stroke"/>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
<polyline points="{{l.points}}" style="{{l.lineStyle}}"/>
</sc-for>
</svg>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
<span style="{{d.dotStyle}}" title="{{d.tip}}"><span style="{{d.numStyle}}">{{d.txt}}</span></span>
</sc-for>
</div>
<div style="position: relative; height: 20px; margin-top: 4px; font-size: 11px; color: #5b6070">
<sc-for list="{{xlabels}}" as="x" hint-placeholder-count="6">
<span style="position: absolute; left: {{x.left}}%; transform: translateX(-50%)">{{x.text}}</span>
</sc-for>
</div>
<div style="font-size: 13px; color: #3a3d45; font-weight: 600">{{areaNote}}</div>
</div>
</div>
</section>

<section style="flex: 1 1 600px; min-width: 0; border: 1px solid #e3e5ea; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div>
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; color: #C8102E">Career Progress</h2>
<p style="margin: 2px 0 0; color: #5b6070; font-size: 13px">Tu seguimiento de canciones, contenido, prensa y más.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="color: #5b6070; font-size: 14px">{{cpEmpty}}</div>
<sc-for list="{{progress}}" as="c" hint-placeholder-count="4">
<div>
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 6px"><span>{{c.label}}</span><span style="color: #4a4f5c; font-weight: 500">{{c.count}}</span></div>
<div style="height: 10px; border-radius: 999px; background: #eceef2; overflow: hidden"><div style="{{c.barStyle}}"></div></div>
</div>
</sc-for>
</div>
<button type="button" data-href="/career-progress" style="align-self: flex-start; background: #ffffff; color: #C8102E; border: 1.5px solid #C8102E; border-radius: 999px; padding: 10px 20px; min-height: 44px; font-weight: 600; font-size: 14px">Ver mi Career Progress</button>
</section>

<section style="flex: 1 1 600px; min-width: 0; border: 1px solid #e3e5ea; border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">
<div>
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 24px; color: #C8102E">Ruta hacia tu audición</h2>
<p style="margin: 2px 0 0; color: #5b6070; font-size: 13px">Avance de tu preparación para Berklee.</p>
</div>
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; font-weight: 700; line-height: 1">{{rutaPct}}%</div>
<div style="height: 8px; border-radius: 999px; background: #eceef2; overflow: hidden"><div style="width: {{rutaPct}}%; height: 100%; background: #C8102E"></div></div>
<div style="color: #5b6070; font-size: 13px">{{rutaNote}}</div>
</section>
</div>

</div>
</div>
</script>

<script>
// ===== Datos reales (Supabase EMN) =====
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'], MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const KIND = {
  piece:     { label: 'Piece Prep & Improvisation',  bg: '#FBDDE1', fg: '#6E0A1A' },
  sight:     { label: 'Sight Read & Audio Training', bg: '#D5E1F6', fg: '#14305F' },
  interview: { label: 'Interview Prep',              bg: '#D3EEDD', fg: '#0F4A2A' },
  tutor:     { label: 'Tutoring',                    bg: '#E6DDF5', fg: '#3E1F73' },
  mock:      { label: 'Mock Audition',               bg: '#1a1a1d', fg: '#ffffff' }
};
function kindOf(curso){
  const c = String(curso || '').toLowerCase();
  if(c.includes('piece') || c.includes('improv')) return KIND.piece;
  if(c.includes('audio') || c.includes('sight') || c.includes('read') || c.includes('ear')) return KIND.sight;
  if(c.includes('interview')) return KIND.interview;
  if(c.includes('mock')) return KIND.mock;
  if(c.includes('tutor')) return KIND.tutor;
  return { label: curso, bg: '#E9EAEE', fg: '#3a3d45' };
}
const CP = [
  ['social','Contenido Social Media','estado','Publicado'], ['canciones','Canciones Publicadas','progreso','Publicado'],
  ['tv','TV','estado','Emitido'], ['diarios','Diarios','estado','Publicado'], ['presskit','PressKit','estado','Listo'],
  ['portfolio','Portfolio/Website','estado','Publicado'], ['concursos','Concursos Musicales','estado','Resultado recibido'],
  ['voluntariado','Voluntariado','estado','Completado']
];
const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const getTz = () => emnGetTz();
// A class is saved as a date + hour in Lima time (UTC-5). Returns the real instant.
const limaInstant = (fecha, hora) => { const [y,mo,d] = fecha.split('-').map(Number); const [h,mi] = (hora || '00:00').split(':').map(Number); return new Date(Date.UTC(y, mo-1, d, h + 5, mi || 0)); };
// ===== SingSync: la sala es la clase. Abierta 12 h antes y 12 h después de su hora (misma regla que singsync_acceso en la base) =====
const SINGSYNC_MS = 12 * 3600 * 1000;
// Link del botón grande: la clase cuya ventana incluye este momento (si hay dos, la más cercana); si no hay ninguna, la próxima clase.
function singsyncHref(now){
  const t = now.getTime();
  const cl = (S.resumen?.clases || []).filter(c => c.id).map(c => ({ id: c.id, dt: limaInstant(c.fecha, c.hora).getTime() }));
  const open = cl.filter(c => Math.abs(t - c.dt) <= SINGSYNC_MS).sort((a, b) => Math.abs(t - a.dt) - Math.abs(t - b.dt))[0];
  const pick = open || cl.filter(c => c.dt > t).sort((a, b) => a.dt - b.dt)[0];
  return pick ? '/singsync?clase=' + encodeURIComponent(pick.id) : '/singsync';
}
// Botón redondo de SingSync para cada clase de un día, debajo del de videollamada (relleno oscuro = sala abierta ahora).
function singsyncBtns(list, past){
  const now = Date.now();
  return list.filter(e => e.id).map(e => {
    const live = Math.abs(now - e.dt.getTime()) <= SINGSYNC_MS;
    const st = 'width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;box-sizing:border-box;text-decoration:none;' +
      (live ? 'background:#2b2e36;color:#fff;border:1.5px solid #2b2e36;' : 'background:#fff;color:#2b2e36;border:1.5px solid #2b2e36;') + (past && !live ? 'opacity:0.5;' : '');
    return '<a href="/singsync?clase=' + encodeURIComponent(e.id) + '" target="_blank" rel="noopener" title="SingSync: ' + esc(e.k.label) + (live ? ' (sala abierta)' : '') + '" aria-label="SingSync de ' + esc(e.k.label) + '" style="' + st + '">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></a>';
  }).join('');
}
const dayIn = (dt) => new Intl.DateTimeFormat('en-CA', { timeZone: getTz(), year: 'numeric', month: '2-digit', day: '2-digit' }).format(dt);
const timeIn = (dt) => new Intl.DateTimeFormat('es-PE', { timeZone: getTz(), hour: 'numeric', minute: '2-digit', hour12: true }).format(dt);
// date + Lima time -> { f: 'YYYY-MM-DD' in the chosen zone, t: '6:00 p. m.' in the chosen zone }
const conv = (fecha, hora) => { const dt = limaInstant(fecha, hora); return { f: dayIn(dt), t: timeIn(dt), dt }; };
function lastSunday(y, m){ const d = new Date(y, m+1, 0); d.setDate(d.getDate() - d.getDay()); return d; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Partes de la audición para "Tu progreso por área" (clave = campo de mi_aula_resumen.puntajes).
const AREAS = [
  { k: 'piece',     label: 'Piece',         color: '#C8102E' },
  { k: 'audio',     label: 'Audio',         color: '#2F6FDB' },
  { k: 'sight',     label: 'Sight Read',    color: '#0F8A4F' },

// Puntajes de cada Mock Audition agrupados por mes (si hubo dos en un mes, promedio). Devuelve los datos del gráfico.
function buildProgreso(now){
  const rows = (S.resumen?.puntajes || []).filter(r => r && r.fecha);
  const sel = AREAS.filter(a => S.area === 'all' || a.k === S.area);
  const optHtml = '<option value="all"' + (S.area === 'all' ? ' selected' : '') + '>Todas las partes</option>' +
    AREAS.map(a => '<option value="' + a.k + '"' + (S.area === a.k ? ' selected' : '') + '>' + a.label + '</option>').join('');
  const out = { areaOptions: optHtml, lines: [], dots: [], xlabels: [], chartLegend: '', chartEmpty: '', areaNote: '' };
  const mk = f => { const [y, m] = f.split('-').map(Number); return y * 12 + (m - 1); };
  const byMonth = {};   // mes -> clave -> [valores]
  rows.forEach(r => AREAS.forEach(a => {
    const v = r[a.k]; if(v == null || isNaN(Number(v))) return;
    const m = mk(r.fecha); ((byMonth[m] = byMonth[m] || {})[a.k] = byMonth[m][a.k] || []).push(Number(v));
  }));
  const months = Object.keys(byMonth).map(Number);
  if(!months.length){ out.chartEmpty = 'Aún no tienes Mock Auditions evaluados. Cuando tu profesor guarde el primero, verás aquí tu avance mes a mes.'; return out; }
  const cur = now.getFullYear() * 12 + now.getMonth();
  let end = Math.max(cur, ...months), start = Math.min(...months, end - 5);
  start = Math.max(start, end - 11);
  const n = end - start + 1, xOf = i => n === 1 ? 50 : 3 + 94 * i / (n - 1), yOf = v => 96 - 92 * Math.max(0, Math.min(100, v)) / 100;
  for(let i = 0; i < n; i++){
    const m = start + i, mo = m % 12, yr = Math.floor(m / 12);
    out.xlabels.push({ left: xOf(i).toFixed(2), text: MES_C[mo] + (i === 0 || mo === 0 ? ' ' + String(yr).slice(2) : '') });
  }
  const single = sel.length === 1;
  const fmtN = v => String(Math.round(v * 10) / 10);
  sel.forEach(a => {
    const pts = [];
    for(let i = 0; i < n; i++){
      const arr = byMonth[start + i]?.[a.k]; if(!arr) continue;
      const v = arr.reduce((s, x) => s + x, 0) / arr.length, mo = (start + i) % 12;
      pts.push({ i, v, mo });
      out.dots.push({
        dotStyle: 'position: absolute; width: 11px; height: 11px; border-radius: 50%; background:' + a.color + '; border: 2px solid #fff; box-shadow: 0 0 0 1px ' + a.color + '; transform: translate(-50%,-50%); left:' + xOf(i).toFixed(2) + '%; top:' + yOf(v).toFixed(2) + '%;',
        tip: esc(a.label + ' · ' + MESES[mo] + ': ' + fmtN(v) + '/100'),
        numStyle: single ? 'position: absolute; bottom: 13px; left: 50%; transform: translateX(-50%); font-size: 11.5px; font-weight: 700; color:' + a.color + '; white-space: nowrap;' : 'display: none;',
        txt: fmtN(v)
      });
    }
    if(!pts.length) return;
    if(pts.length > 1) out.lines.push({ points: pts.map(p => xOf(p.i).toFixed(2) + ',' + yOf(p.v).toFixed(2)).join(' '),
      lineStyle: 'fill: none; stroke:' + a.color + '; stroke-width: 2.5px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke;' });
    if(single){
      const last = pts[pts.length - 1], prev = pts[pts.length - 2];
      out.areaNote = a.label + ' · último Mock (' + MESES[last.mo] + '): ' + fmtN(last.v) + '/100' +
        (prev ? ' · ' + (last.v - prev.v >= 0 ? '+' : '') + fmtN(last.v - prev.v) + ' vs. ' + MESES[prev.mo].toLowerCase() : '');
    }
  });
  if(!out.dots.length) out.chartEmpty = 'Todavía no hay puntajes de ' + (sel[0]?.label || 'esta parte') + ' en tus Mock Auditions.';
  out.chartLegend = single ? '' : sel.map(a => '<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background:' + a.color + '"></span>' + a.label + '</span>').join('');
  return out;
}

// ===== Racha en días con semanas off =====
// Cada semana (lunes a domingo) con >= 5 h suma +7 días. Cada 4 semanas cumplidas se gana 1 semana off (máx. 4 guardadas).
// Una semana sin meta: si el alumno usa una semana off la racha se protege (sin sumar); si no, vuelve a 0.
// Máximo 2 semanas off seguidas; luego hay que cumplir una semana. La semana que acaba de terminar queda "pendiente" para decidir.
const META_SEG = 5 * 3600;
function calcRacha(secs, offs, now){
  const r = { dias: 0, ciclo: 0, banco: 0, insignias: 0, pendiente: null };
  const monOf = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const parse = k => { const [a, b, c] = k.split('-').map(Number); return new Date(a, b - 1, c); };
  const dates = Object.keys(secs).filter(k => secs[k] > 0).sort();
  if(!dates.length) return r;
  const wk = {};
  Object.keys(secs).forEach(k => { const w = ymd(monOf(parse(k))); wk[w] = (wk[w] || 0) + secs[k]; });
  const curMon = monOf(now), curKey = ymd(curMon);
  const prev = new Date(curMon); prev.setDate(prev.getDate() - 7); const prevKey = ymd(prev);
  let consec = 0;
  for(const w = monOf(parse(dates[0])); w <= curMon; w.setDate(w.getDate() + 7)){
    const key = ymd(w);
    if((wk[key] || 0) >= META_SEG){
      r.dias += 7; r.ciclo++; consec = 0;
      if(r.ciclo >= 4){ r.ciclo = 0; r.banco = Math.min(4, r.banco + 1); r.insignias++; }
      continue;
    }
    if(key === curKey || r.dias === 0) continue;   // semana en curso, o nada que proteger
    const puede = r.banco > 0 && consec < 2;
    if(offs[key] === true && puede){ r.banco--; consec++; continue; }
    if(offs[key] === undefined && key === prevKey && puede){ r.pendiente = key; continue; }
    r.dias = 0; r.ciclo = 0; consec = 0;   // racha rota
  }
  return r;
}

function getData(){
  const now = new Date(), todayStr = dayIn(now);
  const al = S.resumen?.alumno || null;

  const first = (al?.nombre || prof?.full_name || (S.target === S.me ? emnStudentProfile?.full_name : '') || '').trim().split(/\s+/)[0] || '';
  const sub = al ? [al.instrumento, al.pais === 'Peru' ? 'Perú' : al.pais].filter(Boolean).join(' | ') : '';
  const clases = (S.resumen?.clases || []);
  const mock = (S.resumen?.mock || []);

  const ev = {};
  const add = (f, e) => (ev[f] = ev[f] || []).push(e);
  clases.forEach(c => { const x = conv(c.fecha, c.hora); add(x.f, { k: kindOf(c.curso), t: x.t, link: c.link, id: c.id, dt: x.dt }); });
  if(al){
    for(let i = -1; i <= 1; i++){
      const d = lastSunday(S.vy, S.vm + i);
      const f = ymd(d), slot = mock.find(x => x.fecha === f);
      if(slot){ const x = conv(f, String(slot.hora).padStart(2,'0') + ':00'); add(x.f, { k: KIND.mock, t: x.t, link: slot.link || null }); }
      else add(f, { k: KIND.mock, t: '', link: null });

  }

  const first1 = new Date(S.vy, S.vm, 1), dim = new Date(S.vy, S.vm + 1, 0).getDate();
  const total = Math.ceil((first1.getDay() + dim) / 7) * 7;
  const cells = [];
  for(let i = 0; i < total; i++){
    const d = new Date(S.vy, S.vm, 1 - first1.getDay() + i);
    const inMonth = d.getMonth() === S.vm, f = ymd(d);
    const today = f === todayStr, past = f < todayStr;
    const list = inMonth ? (ev[f] || []) : [];
    const link = (list.find(e => e.link) || {}).link || '';
    const cellStyle = 'min-height: 64px; box-sizing: border-box; border-radius: 10px; padding: 5px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 3px;' +
      (today ? 'background:#FDE8EB;border:1.5px solid #C8102E;' : 'background:#F4F5F7;border:1.5px solid transparent;') + (inMonth ? '' : 'opacity:0.4;');
    const numStyle = 'font-family:"Source Serif 4",Georgia,serif;font-size:14px;font-weight:' + (today ? '700' : '500') + ';color:' + (today ? '#A50D26' : '#2b2e36') + ';';
    const btnBase = 'width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;box-sizing:border-box;';
    const btnStyle = btnBase + (today ? 'background:#C8102E;color:#fff;border:0;' : 'background:#fff;color:#C8102E;border:1.5px solid #C8102E;') + (past ? 'opacity:0.5;' : '');
    const chips = list.map(e => '<div title="' + esc(e.t || '') + '" style="font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 6px;line-height:1.25;background:' + e.k.bg + ';color:' + e.k.fg + ';' + (past ? 'opacity:0.6;' : '') + '">' + esc(e.k.label) + '</div>').join('');
    cells.push({
      n: d.getDate(), cellStyle, numStyle, chips, link: esc(link), btnStyle, singsyncs: singsyncBtns(list, past),
      hasLink: list.length > 0 && !!link, noLink: list.length > 0 && !link,
      btnLabel: list.length ? 'Videollamada de ' + list[0].k.label + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase() : ''
    });
  }
  const legendKinds = [];
  (al?.cursos || []).concat(al ? ['Tutoring'] : [], clases.map(c => c.curso)).forEach(c => { const k = kindOf(c); if(!legendKinds.includes(k.label) && k !== KIND.mock) legendKinds.push(k.label); });
  const legend = legendKinds.map(l => { const k = Object.values(KIND).find(x => x.label === l) || { bg: '#E9EAEE', fg: '#3a3d45' };
    return { label: esc(l), style: 'display: inline-flex; align-items: center; gap: 6px; background:' + k.bg + '; color:' + k.fg + '; font-weight: 600; font-size: 12.5px; border-radius: 999px; padding: 5px 11px' }; });

  const upcoming = clases.map(c => ({ c, dt: limaInstant(c.fecha, c.hora) })).filter(x => x.dt >= now).sort((a,b) => a.dt - b.dt)[0];
  let proxClase = 'Sin clases programadas';
  if(upcoming){
    const toDay = (f) => { const [y,mo,d] = f.split('-').map(Number); return new Date(y, mo-1, d); };
    const dd = toDay(dayIn(upcoming.dt)), t0 = toDay(dayIn(now));
    const diff = Math.round((dd - t0) / 86400000);
    const dn = DIAS[dd.getDay()];
    const when = diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : dn[0].toUpperCase() + dn.slice(1) + ' ' + dd.getDate() + ' ' + MES_C[dd.getMonth()];
    proxClase = when + ' · ' + timeIn(upcoming.dt);
  }

  let ms = lastSunday(now.getFullYear(), now.getMonth());
  if(ymd(ms) < todayStr) ms = lastSunday(now.getFullYear(), now.getMonth() + 1);
  const slot = mock.find(x => x.fecha === ymd(ms));
  let mockTxt = al ? 'Dom ' + ms.getDate() + ' ' + MES_C[ms.getMonth()] : '—';
  if(slot) mockTxt += ' · ' + conv(ymd(ms), String(slot.hora).padStart(2,'0') + ':00').t;

  const secs = {};
  S.practice.forEach(r => { secs[r.activity_date] = (secs[r.activity_date] || 0) + (r.seconds || 0); });
  const rc = calcRacha(secs, S.offs, now);
  const racha = rc.dias;
  const vistaAl = S.target === S.me && !S.isAdmin && !S.isProf;
  let offBanner = '';
  if(rc.pendiente){
    const btn = 'border: 0; border-radius: 10px; padding: 10px 18px; min-height: 44px; font-size: 14px; font-weight: 600; ';
    offBanner = '<div style="border: 1.5px solid #C8102E; background: #FDF1F3; border-radius: 14px; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">' +
      '<div style="font-size: 14.5px; line-height: 1.4"><strong>La semana pasada no llegaste a tu meta de 5 h.</strong><br>' +
      (vistaAl ? '¿Usar una semana off para proteger tu racha de ' + racha + ' días? Te quedan ' + rc.banco + '. Si no la usas, tu racha vuelve a 0.' : 'El alumno debe decidir si usa una semana off (le quedan ' + rc.banco + '). Si no la usa, su racha vuelve a 0.') + '</div>' +
      (vistaAl ? '<div style="display: flex; gap: 10px"><button type="button" data-act="off" data-v="1" style="' + btn + 'background: #C8102E; color: #fff">Usar semana off</button><button type="button" data-act="off" data-v="0" style="' + btn + 'background: #fff; color: #1a1a1d; border: 1px solid #d5d8df">No usar</button></div>' : '') + '</div>';
  }
  const rachaSub = (4 - rc.ciclo) + ' ' + (4 - rc.ciclo === 1 ? 'semana' : 'semanas') + ' para tu próxima semana off · Semanas off: ' + rc.banco;
  const mon = new Date(now); mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7)); const monStr = ymd(mon);
  let wk = 0; Object.keys(secs).forEach(f => { if(f >= monStr && f <= todayStr) wk += secs[f]; });
  const horas = Math.round(wk / 360) / 10;

  const progress = [], cpPcts = [];
  CP.forEach(([id, name, key, last]) => {
    const rows = (S.career && S.career[id]) || [];
    if(!rows.length) return;
    const done = rows.filter(r => r[key] === last).length, pct = Math.round(done / rows.length * 100);
    progress.push({ label: name, count: done + ' / ' + rows.length, barStyle: 'height:100%;background:#C8102E;border-radius:999px;width:' + pct + '%;' });
    cpPcts.push(pct);
  });

  // Ruta hacia tu audición = 25 pts Career Progress + 75 pts Mock Audition.
  // Career: promedio del % de las categorías con elementos. Mock: por cada parte cuenta solo la MEJOR nota
  // (una nota más baja no resta; una más alta suma la diferencia). Las partes sin nota aportan 0. Todas son sobre 100.
  const cpAvg = cpPcts.length ? cpPcts.reduce((a, b) => a + b, 0) / cpPcts.length : 0;
  const best = AREAS.map(a => Math.max(0, ...(S.resumen?.puntajes || []).map(r => Number(r?.[a.k]) || 0)));
  const mockAvg = best.reduce((a, b) => a + b, 0) / AREAS.length;
  const cpPts = cpAvg * 0.25, mockPts = mockAvg * 0.75;
  const rutaPct = Math.min(100, Math.round(cpPts + mockPts));
  const rutaNote = (al || S.career) ? 'Career Progress ' + Math.round(cpPts) + ' / 25 · Mock Audition ' + Math.round(mockPts) + ' / 75' : '';

  // Tareas pendientes: las que el profesor deja en /calendario (alumnos.datos._tareas) y aún no están hechas.
  const linkify = txt => esc(txt).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#C8102E;text-decoration:underline">Abrir link</a>').replace(/\n/g, '<br>');
  // El alumno ve solo las pendientes y las marca con un clic. El profesor/admin ve también las hechas, opacas.
  const vistaAlumno = S.target === S.me && !S.isAdmin && !S.isProf;
  const todas = S.resumen?.alumno?.tareas || [];
  const pendientes = todas.filter(t => !t.hecha).length;
  const tasks = (vistaAlumno ? todas.filter(t => !t.hecha) : todas).map(t => ({
    id: esc(t.id), title: linkify(t.texto),
    meta: esc(t.curso || '') + (t.hecha ? (t.hecha_por === 'alumno' ? ' · el alumno la marcó como hecha' : ' · hecha') : ''),
    rowStyle: t.hecha ? 'opacity: .45;' : '',
    boxStyle: t.hecha ? 'background: #C8102E; border-color: #C8102E;' : '',
    mark: t.hecha ? '✓' : '', cursor: vistaAlumno ? 'pointer' : 'default'
  }));
  const pickStyle ='font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1d; background: #ffffff; border: 1.5px solid #d5d8df; border-radius: 999px; padding: 9px 14px; min-height: 44px';
  const picker = S.isProf ? '<select data-act="student" aria-label="Ver alumno" style="' + pickStyle + '">' +
    S.students.map(x => '<option value="' + x.id + '"' + (x.id === S.target ? ' selected' : '') + '>' + esc(x.full_name || x.email) + '</option>').join('') + '</select>'
    : (S.isAdmin ? '<select data-act="student" aria-label="Ver como alumno" style="font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600; color: #1a1a1d; background: #ffffff; border: 1.5px solid #d5d8df; border-radius: 999px; padding: 9px 14px; min-height: 44px">' +
    '<option value="' + S.me + '"' + (S.target === S.me ? ' selected' : '') + '>Mi vista (admin)</option>' +
    S.students.filter(x => x.id !== S.me).map(x => '<option value="' + x.id + '"' + (x.id === S.target ? ' selected' : '') + '>' + esc(x.full_name || x.email) + '</option>').join('') + '</select>' : '');

  return {
    singsyncHref: esc(singsyncHref(now)),
    nombre: esc(first), sub: esc(sub), ringDash: (rutaPct * 157.1 / 100).toFixed(1), rutaPct, rutaNote, picker,
    proxClase, tareasTxt: pendientes + ' por entregar', mockTxt, rachaTxt: racha + (racha === 1 ? ' día' : ' días'), rachaSub, offBanner,
    monthTitle: MESES[S.vm] + ' ' + S.vy, legend, cells,
    tasks, tasksCount: pendientes, tasksEmpty: tasks.length ? '' : (vistaAlumno ? 'No tienes tareas pendientes.' : 'Este alumno no tiene tareas.'),
    metaTxt: '5 h', metaPct: Math.min(100, Math.round(wk / META_SEG * 100)), horasTxt: horas + ' h',
    ...buildProgreso(now), progress, cpEmpty: progress.length ? '' : 'Aún no tienes elementos en tu Career Progress.'
  };
}

// ===== Renderizador minimo: sc-for / sc-if / {{ruta}} =====
function lookup(ctx, path) {
  return path.trim().split('.').reduce((o, k) => (o == null ? undefined : o[k]), ctx);
}
function renderIfs(str, ctx) {
  return str.replace(/<sc-if value="\{\{\s*([\w.]+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g, (_, path, inner) => (lookup(ctx, path) ? inner : ''));
}
function renderHoles(str, ctx) {
  return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, path) => {
    const v = lookup(ctx, path);
    return v == null ? '' : String(v);
  });
}
function render(tpl, data) {
  let out = tpl.replace(/<sc-for list="\{\{\s*(\w+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g, (_, list, as, inner) =>
    (data[list] || []).map((item, i) => {
      const ctx = Object.assign({}, data, { [as]: item, $index: i });
      return renderHoles(renderIfs(inner, ctx), ctx);
    }).join('')
  );
  return renderHoles(renderIfs(out, data), data);
}

// ===== Arranque: alumno (su propia vista) o admin (puede elegir alumno) =====
function paint(){
  const app = document.getElementById('mi-aula-app');
  app.innerHTML = render(document.getElementById('tpl').textContent, getData());
  app.hidden = false;
}
emnInit().then(async () => {
  const gate = document.getElementById('aula-gate');
  const role = emnStudentProfile?.role || null;
  if(!emnSession){
    gate.innerHTML = 'Inicia sesión para entrar a tu aula. <a href="/emn-login">Inicia sesión</a>';
    gate.hidden = false; return;
  }
  if(role !== 'admin' && role !== 'professor' && role !== 'student' && role !== 'alumno'){
    gate.textContent = 'Tu vista de Mi Aula está en construcción.';
    gate.hidden = false; return;
  }
  S.me = emnSession.user.id; S.target = S.me; S.isAdmin = role === 'admin'; S.isProf = role === 'professor';
  const n = new Date(); S.vy = n.getFullYear(); S.vm = n.getMonth();
  if(S.isProf){
    // El profesor ve a SUS alumnos (los que lo tienen asignado en algún curso) en un desplegable.
    const r = await emnSupabase.rpc('mi_aula_mis_alumnos');
    S.students = (r.data || []).map(x => ({ id: x.id, full_name: x.nombre }));
    if(!S.students.length){
      gate.textContent = 'Todavía no tienes alumnos asignados con cuenta en la app. Cuando Daniel te asigne un curso, aparecerán aquí.';
      gate.hidden = false; return;
    }
    S.target = S.students[0].id;
  } else if(S.isAdmin){
    const r = await emnSupabase.from('students').select('id,full_name,email,role').eq('role', 'student').order('full_name');
    S.students = r.data || [];
  }
  await loadTarget();
  paint();
  const app = document.getElementById('mi-aula-app');
  app.addEventListener('click', (e) => {
    const h = e.target.closest('[data-href]'); if(h){ location.href = h.dataset.live === 'singsync' ? singsyncHref(new Date()) : h.dataset.href; return; }   // el botón de SingSync se recalcula al hacer clic, por si la ventana cambió con la página abierta
    const a = e.target.closest('[data-act]'); if(!a) return;
    const act = a.dataset.act;
    if(act === 'tarea'){
      if(!(S.target === S.me && !S.isAdmin && !S.isProf)) return;   // solo el alumno marca las suyas
      const tl = S.resumen?.alumno?.tareas || [];
      S.resumen.alumno.tareas = tl.map(t => t.id === a.dataset.id ? { ...t, hecha: true, hecha_por: 'alumno' } : t);   // desaparece al instante
      paint();
      emnSupabase.rpc('mi_aula_tarea_hecha', { p_id: a.dataset.id }).then(({ error }) => {
        if(error){ console.error(error); S.resumen.alumno.tareas = tl; paint(); }   // si falla, vuelve a aparecer
      });
      return;
    }
    if(act === 'off'){
      if(!(S.target === S.me && !S.isAdmin && !S.isProf)) return;
      const rc = calcRacha(Object.fromEntries(Object.entries(S.practice.reduce((o, r) => (o[r.activity_date] = (o[r.activity_date] || 0) + (r.seconds || 0), o), {}))), S.offs, new Date());
      if(!rc.pendiente) return;
      const wkey = rc.pendiente, v = a.dataset.v === '1';
      S.offs[wkey] = v; paint();
      emnSupabase.from('practice_off_weeks').insert({ student_id: S.me, week_start: wkey, usada: v }).then(({ error }) => {
        if(error){ console.error(error); delete S.offs[wkey]; paint(); }
      });
      return;
    }
    if(act === 'prev'){ S.vm--; if(S.vm < 0){ S.vm = 11; S.vy--; } paint(); }
    else if(act === 'next'){ S.vm++; if(S.vm > 11){ S.vm = 0; S.vy++; } paint(); }
    else if(act === 'today'){ const t = new Date(); S.vy = t.getFullYear(); S.vm = t.getMonth(); paint(); }
  });
  app.addEventListener('change', async (e) => {
    if(e.target.dataset.act === 'area'){ S.area = e.target.value; paint(); return; }
    if(e.target.dataset.act !== 'student') return;
    S.target = e.target.value; await loadTarget(); paint();
  });
});
