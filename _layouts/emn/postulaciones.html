<!DOCTYPE html>
<html lang="es" class="emn-landing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include emn-favicon.html %}
<title>EMN — Postulaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/assets/css/emn.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/emn-auth.js?v={{ site.time | date: '%s' }}"></script>
<style>
  body{ background:var(--gray-100); font-family:var(--font-body); color:var(--ink); margin:0; }
  .wrap-p{ max-width:1100px; margin:0 auto; padding:32px 24px 60px; }
  .head-p{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:22px; }
  .head-p h1{ font-family:var(--font-display); font-size:26px; margin:0; }
  .head-p a{ font-size:13px; color:var(--gray-700); }
  #gate-msg{ text-align:center; padding:80px 20px; color:var(--gray-700); }
  #gate-msg a{ color:var(--red); font-weight:600; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .chip{ border:1px solid var(--gray-300); background:var(--paper); border-radius:999px; padding:7px 14px; font:600 12.5px var(--font-body); color:var(--gray-700); cursor:pointer; }
  .chip:hover{ border-color:var(--red); color:var(--red); }
  .chip[aria-pressed="true"]{ background:var(--red); border-color:var(--red); color:#fff; }
  .box{ background:var(--paper); border:1px solid var(--gray-300); border-radius:var(--radius); overflow-x:auto; }
  table{ width:100%; min-width:860px; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--gray-500); padding:11px 12px 9px; border-bottom:1px solid var(--gray-300); white-space:nowrap; }
  td{ padding:11px 12px; border-bottom:1px solid var(--gray-100); vertical-align:top; }
  tr:last-child td{ border-bottom:0; }
  td a{ color:var(--red); font-weight:600; word-break:break-all; }
  td a:hover{ text-decoration:underline; }
  td.date{ white-space:nowrap; color:var(--gray-700); }
  td.name{ font-weight:600; }
  select.estado{ font:600 12.5px var(--font-body); padding:6px 8px; border:1px solid var(--gray-300); border-radius:6px; background:var(--paper); cursor:pointer; }
  select.estado.nuevo{ border-color:var(--red); color:var(--red); }
  select.estado.contactado{ border-color:#1E8E5A; color:#1E8E5A; }
  select.estado.descartado{ color:var(--gray-500); }
  .x{ border:0; background:none; cursor:pointer; color:var(--gray-500); font-size:18px; line-height:1; padding:4px 8px; border-radius:6px; }
  .x:hover{ color:var(--red); background:var(--gray-100); }
  .empty{ padding:40px 20px; text-align:center; color:var(--gray-500); }
  .err{ color:var(--red); font-weight:600; }
</style>
</head>
<body>

{% include emn-header.html %}

<div class="wrap-p">
  <div class="head-p">
    <h1>Postulaciones</h1>
    <a href="/administrar">&larr; Volver a Administrar</a>
  </div>

  <div id="gate-msg" style="display:none"></div>

  <div id="body-p" style="display:none">
    <div class="filters" id="filters" role="group" aria-label="Filtrar por estado">
      <button type="button" class="chip" data-f="" aria-pressed="true">Todas</button>
      <button type="button" class="chip" data-f="nuevo" aria-pressed="false">Nuevas</button>
      <button type="button" class="chip" data-f="contactado" aria-pressed="false">Contactadas</button>
      <button type="button" class="chip" data-f="descartado" aria-pressed="false">Descartadas</button>
    </div>
    <div class="box">
      <table>
        <thead><tr><th>Fecha</th><th>Nombre</th><th>Correo</th><th>WhatsApp</th><th>Video tocando</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows = [], filter = '';

// Only http(s) links are turned into clickable links — the video field is free text from the public.
const safeUrl = u => /^https?:\/\//i.test(u) ? u : null;
const waUrl = n => 'https://wa.me/' + String(n).replace(/\D/g, '');
const fmtDate = iso => new Date(iso).toLocaleString('es-PE', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

function render(){
  const list = filter ? rows.filter(r => r.estado === filter) : rows;
  $('#tbody').innerHTML = list.length ? list.map(r => {
    const v = safeUrl(r.video);
    return `<tr data-id="${r.id}">
      <td class="date">${esc(fmtDate(r.created_at))}</td>
      <td class="name">${esc(r.nombre)}</td>
      <td><a href="mailto:${esc(r.correo)}">${esc(r.correo)}</a></td>
      <td><a href="${esc(waUrl(r.whatsapp))}" target="_blank" rel="noopener">${esc(r.whatsapp)}</a></td>
      <td>${v ? `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>` : esc(r.video)}</td>
      <td><select class="estado ${r.estado}" aria-label="Estado de ${esc(r.nombre)}">
        ${['nuevo','contactado','descartado'].map(e => `<option value="${e}"${e === r.estado ? ' selected' : ''}>${e[0].toUpperCase() + e.slice(1)}</option>`).join('')}
      </select></td>
      <td><button class="x" data-del aria-label="Eliminar postulación de ${esc(r.nombre)}" title="Eliminar">×</button></td>
    </tr>`;
  }).join('') : `<tr><td colspan="7" class="empty">${rows.length ? 'No hay postulaciones con ese estado.' : 'Todavía no hay postulaciones.'}</td></tr>`;
}

$('#filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b)));
  render();
});

$('#tbody').addEventListener('change', async e => {
  if(!e.target.classList.contains('estado')) return;
  const tr = e.target.closest('tr'), row = rows.find(r => r.id === tr.dataset.id), prev = row.estado;
  row.estado = e.target.value; e.target.className = 'estado ' + row.estado;
  const { error } = await emnSupabase.from('postulaciones').update({ estado: row.estado }).eq('id', row.id);
  if(error){ console.error(error); row.estado = prev; render(); emnAlert('No se pudo cambiar el estado. Inténtalo de nuevo.'); }
  else if(filter) render();
});

$('#tbody').addEventListener('click', async e => {
  const b = e.target.closest('[data-del]'); if(!b) return;
  const row = rows.find(r => r.id === b.closest('tr').dataset.id);
  if(!(await emnConfirm(`¿Eliminar la postulación de ${row.nombre}? No se puede deshacer.`, { yesLabel: 'Eliminar' }))) return;
  const { error } = await emnSupabase.from('postulaciones').delete().eq('id', row.id);
  if(error){ console.error(error); emnAlert('No se pudo eliminar. Inténtalo de nuevo.'); return; }
  rows = rows.filter(r => r.id !== row.id); render();
});

async function boot(){
  const gate = $('#gate-msg');
  if(!['admin','professor'].includes(emnStudentProfile?.role)){
    gate.innerHTML = emnSession ? 'Esta página es solo para administradores.' : 'Inicia sesión para ver las postulaciones. <a href="/emn-login">Inicia sesión</a>';
    gate.style.display = 'block';
    return;
  }
  const { data, error } = await emnSupabase.from('postulaciones').select('*').order('created_at', { ascending: false });
  if(error){ console.error(error); gate.innerHTML = '<span class="err">No se pudieron cargar las postulaciones.</span>'; gate.style.display = 'block'; return; }
  rows = data || [];
  $('#body-p').style.display = 'block';
  render();
}

emnInit().then(boot);
</script>
</body>
</html>
