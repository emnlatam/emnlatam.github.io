<header class="emn-header{% if include.variant == 'dark' %} emn-header--dark{% endif %}">
  <div class="emn-header__inner">
    <a href="/emn" class="emn-logo" aria-label="EMN — Inicio">
      <img src="/assets/img/emn-logo.png" alt="EMN logo">
    </a>
    <div class="emn-m-bar">
      <a href="/practice-lab" class="emn-m-pl{% if page.url == '/practice-lab' or page.url == '/feedback' or page.url == '/improvisation-lab' %} is-active{% endif %}">Practice Lab</a>
      <span class="emn-m-name"></span>
    </div>
    <button type="button" class="emn-burger" aria-label="Abrir menú" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="emn-nav">
      <div class="emn-nav__item emn-nav__item--pl">
        <a href="/practice-lab" class="emn-nav__link{% if page.url == '/practice-lab' or page.url == '/feedback' or page.url == '/improvisation-lab' %} is-active{% endif %}">Practice Lab</a>
        <button class="emn-nav__caret" aria-label="Abrir submenú de Practice Lab" aria-expanded="false">&#9662;</button>
        <div class="emn-nav__dropdown">
          <a href="/sight-melody" class="emn-nav__dropdown-item">Sight-Read &amp; Audio Practice</a>
          <a href="/interview-prep" class="emn-nav__dropdown-item">Interview Prep</a>
          <a href="/improvisation-lab" class="emn-nav__dropdown-item">Improvisation Lab</a>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Piece <span class="soon">Pronto</span></span>
          <a href="/feedback" class="emn-nav__dropdown-item">Obtén Feedback</a>
        </div>
      </div>
      <a href="/mentores" class="emn-nav__link{% if page.url == '/mentores' %} is-active{% endif %}">Mentores</a>
      <a href="/nosotros" class="emn-nav__link{% if page.url == '/nosotros' %} is-active{% endif %}">Nosotros</a>
      <a href="/cursos" class="emn-nav__link emn-nav__link--cta" hidden>Cursos</a>
    </nav>
  </div>
</header>
<script>
(function(){
  var h = document.currentScript.previousElementSibling; if(!h) return;
  var b = h.querySelector('.emn-burger'), nm = h.querySelector('.emn-m-name');
  function set(o){ h.classList.toggle('is-menu-open', o); b.setAttribute('aria-expanded', String(o)); }
  b.addEventListener('click', function(e){ e.stopPropagation(); set(!h.classList.contains('is-menu-open')); });
  if(nm) nm.addEventListener('click', function(e){ e.stopPropagation(); set(!h.classList.contains('is-menu-open')); });
  document.addEventListener('click', function(e){ if(!h.contains(e.target)) set(false); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') set(false); });
  h.querySelector('.emn-nav').addEventListener('click', function(e){
    var a = e.target.closest('a[href]'); if(a && a.getAttribute('href') !== '#') set(false);
  });
})();
</script>
