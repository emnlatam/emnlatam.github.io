<header class="emn-header{% if include.variant == 'dark' %} emn-header--dark{% endif %}">
  <div class="emn-header__inner">
    <a href="/emn" class="emn-logo" aria-label="EMN — Inicio">
      <img src="/assets/img/emn-logo.png" alt="EMN logo">
    </a>
    <nav class="emn-nav">
      <div class="emn-nav__item">
        <a href="/practice-lab" class="emn-nav__link{% if page.url == '/practice-lab' or page.url == '/feedback' %} is-active{% endif %}">Practice Lab</a>
        <button class="emn-nav__caret" aria-label="Abrir submenú de Practice Lab" aria-expanded="false">&#9662;</button>
        <div class="emn-nav__dropdown">
          <a href="/sight-melody" class="emn-nav__dropdown-item">Sight reading &amp; Audio Practice</a>
          <a href="/interview-prep" class="emn-nav__dropdown-item" data-emn-interview>Interview Prep</a>
          <a href="/feedback" class="emn-nav__dropdown-item">Obtén Feedback</a>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Improvisation Practice <span class="soon">Pronto</span></span>
          <span class="emn-nav__dropdown-item is-disabled">Berklee Piece &amp; Impro <span class="soon">Pronto</span></span>
        </div>
      </div>
      <a href="/mentores" class="emn-nav__link{% if page.url == '/mentores' %} is-active{% endif %}">Mentores</a>
      <a href="/nosotros" class="emn-nav__link{% if page.url == '/nosotros' %} is-active{% endif %}">Nosotros</a>
      <a href="/cursos" class="emn-nav__link emn-nav__link--cta">Cursos</a>
    </nav>
  </div>
</header>
