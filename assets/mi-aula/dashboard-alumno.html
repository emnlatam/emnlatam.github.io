<script>
// ===== DATOS DE EJEMPLO (reemplazar por datos reales más adelante) =====
function getData() {

  const K = {
    piece: { label: 'Piece Prep', bg: '#FBDDE1', fg: '#6E0A1A' },
    sight: { label: 'Sight Read & Audio Training', bg: '#D5E1F6', fg: '#14305F' },
    impro: { label: 'Improvisation', bg: '#FFE8BF', fg: '#5C3A00' },
    interview: { label: 'Interview Prep', bg: '#D3EEDD', fg: '#0F4A2A' },
    mock: { label: 'Mock Audition', bg: '#1a1a1d', fg: '#ffffff' }
  };
  const cells = [];
  for (let i = 0; i < 35; i++) {
    const inMonth = i < 30;
    const n = inMonth ? i + 1 : i - 29;
    const dow = i % 7;
    let kind = null;
    if (inMonth) {
      if (dow === 1) kind = 'piece';
      else if (dow === 2) kind = 'sight';
      else if (dow === 3) kind = 'impro';
      else if (dow === 4) kind = 'interview';
      if (n === 29) kind = 'mock';
    }
    const today = inMonth && n === 25;
    const past = inMonth && n < 25;
    const cellStyle = 'min-height: 64px; box-sizing: border-box; border-radius: 10px; padding: 5px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 3px;' +
      (today ? 'background:#FDE8EB;border:1.5px solid #C8102E;' : 'background:#F4F5F7;border:1.5px solid transparent;') +
      (inMonth ? '' : 'opacity:0.4;');
    const numStyle = 'font-family:"Source Serif 4",Georgia,serif;font-size:14px;font-weight:' + (today ? '700' : '500') + ';color:' + (today ? '#A50D26' : '#2b2e36') + ';';
    const k = kind ? K[kind] : null;
    const btnBase = 'width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none;';
    const btnStyle = btnBase + (today ? 'background:#C8102E;color:#fff;border:0;' : 'background:#fff;color:#C8102E;border:1.5px solid #C8102E;') + (past ? 'opacity:0.5;' : '');
    const chipStyle = k ? 'font-size:11.5px;font-weight:600;border-radius:5px;padding:2px 6px;line-height:1.25;background:' + k.bg + ';color:' + k.fg + ';' + (past ? 'opacity:0.6;' : '') : '';
    cells.push({
      n, cellStyle, numStyle,
      hasEvent: !!k,
      label: k ? k.label : '',
      btnLabel: k ? 'Unirse a la videollamada de ' + k.label + ', ' + n + ' de noviembre' : '',
      btnStyle, chipStyle
    });
  }
  const bar = (pct) => 'height:100%;background:#C8102E;border-radius:999px;width:' + pct + '%;';
  const progress = [
    { label: 'Canciones', count: '4 / 10', barStyle: bar(40) },
    { label: 'Contenido', count: '7 / 12', barStyle: bar(58) },
    { label: 'Prensa', count: '2 / 5', barStyle: bar(40) },
    { label: 'Presencia en redes', count: '3 / 4', barStyle: bar(75) }
  ];
  const X = (i) => 2 + i * 16;
  const Y = (v) => 96 - v * 0.92;
  const defs = [
    ['Piece Prep', '#C8102E', false, [0, 40, 46, 52, 58, 63, 68]],
    ['Sight Read', '#2B5BB5', false, [0, 28, 33, 38, 43, 48, 52]],
    ['Ear Training', '#2B5BB5', true, [0, 20, 26, 31, 36, 41, 45]],
    ['Improvisation', '#B26B00', false, [0, 12, 17, 22, 28, 33, 38]],
    ['Interview Prep', '#1E7A4A', false, [0, 8, 12, 17, 21, 26, 30]]
  ];
  const lines = defs.map(([label, color, dash, vals]) => {
    const last = vals[vals.length - 1];
    return {
      label, pct: last + '%',
      points: vals.map((v, i) => X(i) + ',' + Y(v)).join(' '),
      lineStyle: 'fill:none;stroke:' + color + ';stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;' + (dash ? 'stroke-dasharray:6 4;' : ''),
      dotStyle: 'position:absolute;width:12px;height:12px;border-radius:50%;box-sizing:border-box;transform:translate(-50%,-50%);background:#fff;border:3px solid ' + color + ';left:' + X(6) + '%;top:' + Y(last) + '%;',
      labelStyle: 'position:absolute;left:10px;top:' + Y(last) + '%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.1;',
      swatchStyle: 'display:inline-block;width:16px;height:0;flex:none;border-top:3px ' + (dash ? 'dashed' : 'solid') + ' ' + color + ';'
    };
  });
  const tasks = [
    { title: 'Berklee Mock Audition: reservar y asistir', meta: 'Mock Audition · Dom 29 nov, 11:00 a. m. (Lima)' },
    { title: 'Grabar demo del repertorio 2', meta: 'Piece Prep · Vence vie 27 nov' },
    { title: 'Ejercicios de lectura a primera vista', meta: 'Sight Read & Audio Training · Vence jue 26 nov' },
    { title: 'Completar formulario de aplicación', meta: 'Interview Prep · Vence lun 30 nov' },
    { title: 'Subir solo de improvisación a SingSync', meta: 'Improvisation · Vence mié 2 dic' }
  ];
  return { cells, progress, lines, tasks };
}

// ===== Renderizador mínimo de la plantilla: sc-for / sc-if / {{ruta.a.b}} =====
function lookup(ctx, path) {
  return path.trim().split('.').reduce((o, k) => (o == null ? undefined : o[k]), ctx);
}
function renderIfs(str, ctx) {
  return str.replace(/<sc-if value="\{\{\s*([\w.]+)\s*\}\}"[^>]*>([\s\S]*?)<\/sc-if>/g, (_, path, inner) => (lookup(ctx, path) ? inner : ''));
}
function renderHoles(str, ctx) {
  return str.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, path) => {
    const v = lookup(ctx, path);
    return v == null ? '' : String(v);
  });
}
function render(tpl, data) {
  let out = tpl.replace(/<sc-for list="\{\{\s*(\w+)\s*\}\}" as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g, (_, list, as, inner) =>
    (data[list] || []).map((item, i) => {
      const ctx = Object.assign({}, data, { [as]: item, $index: i });
      return renderHoles(renderIfs(inner, ctx), ctx);
    }).join('')
  );
  return renderHoles(renderIfs(out, data), data);
}
document.getElementById('app').innerHTML = render(document.getElementById('tpl').textContent, getData());
</script>
